# Standard DuckDB community-extension pipeline (C++ / CMake variant), mirroring
# duckdb/extension-template and mgbilby/duckdb-marc21. The released extension
# builds against DuckDB v2.0.0; the same workflow duckdb/community-extensions
# runs on the commit named in description.yml, so a green run here predicts the
# registry build. extension-ci-tools has no v2.0.0 tag yet, so the reusable
# workflow and ci_tools_version stay on its v2.0-cyanoptera branch; move them
# to the tag when it appears.
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: yorc
